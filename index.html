<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        background:
            linear-gradient(
                rgba(10, 0, 20, 0.35),
                rgba(0, 0, 0, 0.65)
            ),

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        text-align: center;

    /* Falling stars */
    #stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
    }

    .star {
        position: absolute;
        top: -10px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 6px white, 0 0 12px #a020f0;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% {
            transform: translateY(-10px);
            opacity: 0;
        }

        10%, 90% {
            opacity: 1;
        }

        100% {
            transform: translateY(110vh);
            opacity: 0;
        }
    }

    /* Enter screen */
    #enter-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: radial-gradient(
            circle,
            #2b0645 0%,
            #08000d 50%,
            #000000 100%
        );

        cursor: pointer;
        transition: opacity 0.7s ease;
    }

    #enter-text {
        font-family: "Courier New", monospace;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 5px;
        color: white;

        text-shadow:
            0 0 5px #fff,
            0 0 15px #a020f0,
            0 0 30px #8a2be2,
            0 0 60px #8a2be2;

        animation: enterGlow 1.5s infinite alternate;
    }

    #enter-screen.hidden {
        opacity: 0;
        pointer-events: none;
    }

    /* Main title */
    h1 {
        position: relative;
        z-index: 2;

        margin-top: 70px;
        margin-bottom: 20px;

        font-family: "Courier New", monospace;
        font-size: 48px;
        letter-spacing: 4px;

        text-shadow:
            0 0 5px #fff,
            0 0 15px #a020f0,
            0 0 30px #8a2be2,
            0 0 60px #8a2be2;

        animation: glow 2s infinite alternate;
    }

    /* Music toggle button */
    .music-toggle {
        position: relative;
        z-index: 2;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;

        margin: 10px 0 25px;
        padding: 16px 25px;
        min-width: 280px;

        border: 3px solid #34333d;
        border-radius: 60px;
        background: rgba(25, 23, 29, 0.94);

        color: #f4f1f7;
        font-size: 25px;
        font-weight: bold;
        cursor: pointer;

        box-shadow: 0 0 10px rgba(160, 32, 240, 0.12);
        transition: 0.25s ease;
    }

    .music-toggle:hover {
        border-color: #a020f0;
        box-shadow: 0 0 18px rgba(160, 32, 240, 0.45);
    }

    .music-toggle:active {
        transform: scale(0.97);
    }

    /* Purple music icon */
    .music-icon {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 30px;
    }

    .music-icon span {
        display: block;
        width: 8px;
        border-radius: 3px;

        background: #a020f0;

        box-shadow:
            0 0 6px #a020f0,
            0 0 12px #8a2be2;

        transition: background 0.25s ease;
    }

    .music-icon span:nth-child(1) {
        height: 12px;
    }

    .music-icon span:nth-child(2) {
        height: 21px;
    }

    .music-icon span:nth-child(3) {
        height: 30px;
    }

    /* Icon turns grey when muted */
    .music-toggle.muted .music-icon span {
        background: #77737f;
        box-shadow: none;
    }

    /* Current song title */
    .song-name {
        position: relative;
        z-index: 2;

        max-width: 90%;
        margin: -12px 0 22px;

        color: #d9a3ff;
        font-family: "Courier New", monospace;
        font-size: 14px;
        font-weight: bold;

        text-shadow:
            0 0 5px #a020f0,
            0 0 12px #8a2be2;

        overflow-wrap: anywhere;
    }

    /* Real audio equalizer */
    .equalizer {
        position: relative;
        z-index: 2;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;

        width: min(90%, 340px);
        height: 65px;
        margin: -12px 0 25px;

        opacity: 0.35;
        transition: opacity 0.2s ease;
    }

    .equalizer span {
        display: block;
        flex: 1;
        min-width: 2px;
        max-width: 8px;
        height: 3px;
        border-radius: 5px;

        background: #a020f0;

        box-shadow:
            0 0 6px #a020f0,
            0 0 12px #8a2be2,
            0 0 20px rgba(160, 32, 240, 0.7);

        will-change: height;
    }

    .equalizer.playing {
        opacity: 1;
    }

    /* Download buttons container */
    .buttons {
        position: relative;
        z-index: 2;

        display: flex;
        flex-direction: column;
        gap: 18px;

        width: min(90%, 450px);
    }

    /* Download buttons */
    .button {
        background: rgba(20, 0, 30, 0.8);
        border: 2px solid #9b30ff;
        border-radius: 14px;

        color: white;
        font-family: Arial, sans-serif;
        font-size: 18px;

        padding: 17px 25px;
        text-decoration: none;

        box-shadow: 0 0 8px rgba(155, 48, 255, 0.4);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease;
    }

    .button:hover {
        transform: translateY(-4px) scale(1.02);
        background: rgba(90, 10, 130, 0.5);

        box-shadow:
            0 0 10px #9b30ff,
            0 0 25px #9b30ff,
            0 0 45px rgba(155, 48, 255, 0.7);
    }

    .button:active {
        transform: scale(0.97);
    }

    /* Footer */
    footer {
        position: relative;
        z-index: 2;

        margin-top: auto;
        padding: 30px;

        color: #6f6178;
        font-size: 13px;
    }

    /* Glow animations */
    @keyframes glow {
        from {
            text-shadow:
                0 0 5px white,
                0 0 15px #8a2be2,
                0 0 30px #8a2be2;
        }

        to {
            text-shadow:
                0 0 10px white,
                0 0 25px #a020f0,
                0 0 50px #a020f0,
                0 0 80px #8a2be2;
        }
    }

    @keyframes enterGlow {
        from {
            opacity: 0.65;
            transform: scale(1);
        }

        to {
            opacity: 1;
            transform: scale(1.05);
        }
    }

    /* Mobile layout */
    @media (max-width: 600px) {
        h1 {
            font-size: 32px;
            margin-top: 50px;
        }

        #enter-text {
            font-size: 21px;
            letter-spacing: 3px;
        }

        .button {

        }

        .music-toggle {
            min-width: 250px;
            font-size: 22px;
            padding: 14px 22px;
        }

        .equalizer {
            gap: 3px;
        }

        .song-name {
            font-size: 12px;
        }
    }
</style>

    <script>
        /* Create falling stars */
        const stars = document.getElementById("stars");

        for (let i = 0; i < 80; i++) {
            const star = document.createElement("div");
            star.classList.add("star");

            star.style.left = Math.random() * 100 + "vw";
            star.style.animationDuration =
                (3 + Math.random() * 5) + "s";

                Math.random() * 5 + "s";

            star.style.width = size + "px";
            star.style.height = size + "px";

            stars.appendChild(star);
        }

        
/* Music playlist */
const music = document.getElementById("music");
const songName = document.getElementById("song-name");

const songs = [
    {
        title: "✻H+3+ЯД✻7luCJIo0T6... (Second Drop + Super Slowed) - vyrval",
        file: "✻H+3+ЯД✻7luCJIo0T6... (second drop + super slowed) - vyrval.mp3"
    },
    {
        title: "Jane! (HoodTrap) - Qura",
        file: "Jane! (HoodTrap) - Qura.mp3"
    },
    {
        title: "Born to pwn - Twikipedia",
        file: "Born to pwn - Twikipedia.mp3"
    },
    {
        title: "Super Fênix Ritimada (2 mins 12 secs) - Notmuchxhead",
        file: "Super Fênix Ritimada (2 mins 12 secs) - Notmuchxhead.mp3"
    },
    {
        title: "Where have you been - Kryd",
        file: "Where have you been - Kryd.mp3"
    }
];

let currentSongIndex = Math.floor(Math.random() * songs.length);

function loadSong(index) {
    currentSongIndex = index;

    music.src = songs[index].file;
    songName.textContent = "Now playing: " + songs[index].title;

    music.load();
}

/* Pick a random song to start */
loadSong(currentSongIndex);

/* Play a different song when the current one finishes */
music.loop = false;

music.addEventListener("ended", async () => {
    let nextSongIndex;

    do {
        nextSongIndex = Math.floor(Math.random() * songs.length);
    } while (
        songs.length > 1 &&
        nextSongIndex === currentSongIndex
    );

    loadSong(nextSongIndex);

    try {
        await music.play();
    } catch (error) {
        console.error("Could not play the next song:", error);
        songName.textContent =
            "Couldn't play: " + songs[nextSongIndex].title;
    }
});

        /* Music toggle */
        const musicToggle =
            document.getElementById("music-toggle");

        const musicStatus =
            document.getElementById("music-status");

        const equalizer =
            document.getElementById("equalizer");

        const bars = Array.from(
            equalizer.querySelectorAll("span")
        );

        /* Audio analyser */
        let audioContext = null;
        let analyser = null;
        let frequencyData = null;
        let audioSource = null;
        let animationFrame = null;
        let smoothedLevels = bars.map(() => 0);

        function setupAnalyser() {
            if (audioContext) {
                return audioContext.resume();
            }

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) {
                throw new Error(
                    "Web Audio API is not supported by this browser."
                );
            }

            audioContext = new AudioContextClass();

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.72;
            analyser.minDecibels = -90;
            analyser.maxDecibels = -15;

            frequencyData = new Uint8Array(
                analyser.frequencyBinCount
            );

            audioSource =
                audioContext.createMediaElementSource(music);

            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);

            return audioContext.resume();
        }

        /* Draw bars from actual audio frequencies */
        function drawEqualizer() {
            animationFrame = null;

            if (!analyser || !frequencyData) {
                return;
            }

            if (
                music.paused ||
                music.ended ||
                music.muted ||
                audioContext.state !== "running"
            ) {
                equalizer.classList.remove("playing");

                bars.forEach((bar, index) => {
                    smoothedLevels[index] *= 0.75;

                    bar.style.height =
                        (2 + smoothedLevels[index] * 48) + "px";
                });

                return;
            }

            equalizer.classList.add("playing");

            analyser.getByteFrequencyData(frequencyData);

            const binCount = frequencyData.length;
            const barCount = bars.length;

            bars.forEach((bar, index) => {
                /*
                 * Spread the bars across the frequency spectrum.
                 * Lower bars represent bass; higher indices
                 * represent mids and treble.
                 */
                const start = Math.floor(
                    Math.pow(index / barCount, 2) * binCount
                );

                const end = Math.max(
                    start + 1,
                    Math.floor(
                        Math.pow((index + 1) / barCount, 2) *
                        binCount
                    )
                );

                let total = 0;
                let count = 0;

                for (
                    let bin = start;
                    bin < Math.min(end, binCount);
                    bin++
                ) {
                    total += frequencyData[bin];
                    count++;
                }

                const level = count > 0
                    ? total / count / 255
                    : 0;

                /* Smooth the movement */
                smoothedLevels[index] +=
                    (level - smoothedLevels[index]) * 0.35;

                const height = Math.max(
                    3,
                    3 + smoothedLevels[index] * 55
                );

                bar.style.height = height + "px";
            });

            animationFrame =
                requestAnimationFrame(drawEqualizer);
        }

        function startEqualizer() {
            if (animationFrame === null) {
                animationFrame =
                    requestAnimationFrame(drawEqualizer);
            }
        }

        function stopEqualizer() {
            if (animationFrame !== null) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            equalizer.classList.remove("playing");

            bars.forEach((bar) => {
                bar.style.height = "3px";
            });

            smoothedLevels = bars.map(() => 0);
        }

   

musicToggle.addEventListener("click", async () => {
    if (!music.paused && !music.muted) {
        music.pause();
        music.muted = true;

        musicStatus.textContent = "Music off";
        musicToggle.classList.add("muted");
        musicToggle.setAttribute("aria-pressed", "true");
        musicToggle.setAttribute("aria-label", "Turn music on");

        stopEqualizer();
        return;
    }

    music.muted = false;

    try {
        await music.play();

        musicStatus.textContent = "Music on";
        musicToggle.classList.remove("muted");
        musicToggle.setAttribute("aria-pressed", "false");
        musicToggle.setAttribute("aria-label", "Turn music off");

        startEqualizer();
    } catch (error) {
        console.error("Could not play music:", error);
        musicStatus.textContent = "Unable to play music";
    }
});

        music.addEventListener("play", startEqualizer);

        music.addEventListener("pause", stopEqualizer);

        music.addEventListener("ended", stopEqualizer);

        /* Enter screen */
        const enterScreen =
            document.getElementById("enter-screen");

        enterScreen.addEventListener("click", async () => {
            try {
                /*
                 * Initialize the analyser during the user's
                 * click, allowing audio on supported browsers.
                 */
                await setupAnalyser();

                await music.play();

                startEqualizer();

                enterScreen.classList.add("hidden");

                setTimeout(() => {
                    enterScreen.remove();
                }, 700);

            } catch (error) {
                console.error(
                    "Could not start music or analyser:",
                    error
                );
            }
        });
    </script>
