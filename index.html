<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUY777 MOD HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(10, 0, 20, 0.35),
                    rgba(0, 0, 0, 0.65)
                ),
                url("Imagem JPEG.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Falling stars */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .star {
            position: absolute;
            top: -10px;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 6px white,
                0 0 12px #a020f0;

            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    #2b0645 0%,
                    #08000d 50%,
                    #000000 100%
                );

            cursor: pointer;
            transition: opacity 0.7s ease;
        }

        #enter-text {
            font-family: "Courier New", monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
            color: white;

            text-shadow:
                0 0 5px #ffffff,
                0 0 15px #a020f0,
                0 0 30px #8a2be2,
                0 0 60px #8a2be2;

            animation: enterGlow 1.5s infinite alternate;
        }

        #enter-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            position: relative;
            z-index: 2;

            margin-top: 70px;
            margin-bottom: 10px;

            font-family: "Courier New", monospace;
            font-size: 48px;
            letter-spacing: 4px;

            text-shadow:
                0 0 5px #ffffff,
                0 0 15px #a020f0,
                0 0 30px #8a2be2,
                0 0 60px #8a2be2;

            animation: glow 2s infinite alternate;
        }

        .buttons {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            gap: 18px;
            width: min(90%, 450px);
        }

        .button {
            background: rgba(20, 0, 30, 0.8);
            border: 2px solid #9b30ff;
            border-radius: 14px;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;

            padding: 17px 25px;
            text-decoration: none;

            box-shadow:
                0 0 8px rgba(155, 48, 255, 0.4);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.02);

            background: rgba(90, 10, 130, 0.5);

            box-shadow:
                0 0 10px #9b30ff,
                0 0 25px #9b30ff,
                0 0 45px rgba(155, 48, 255, 0.7);
        }

        .button:active {
            transform: scale(0.97);
        }

        footer {
            position: relative;
            z-index: 2;

            margin-top: auto;
            padding: 30px;

            color: #6f6178;
            font-size: 13px;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #8a2be2,
                    0 0 30px #8a2be2;
            }

            to {
                text-shadow:
                    0 0 10px #ffffff,
                    0 0 25px #a020f0,
                    0 0 50px #a020f0,
                    0 0 80px #8a2be2;
            }
        }

        @keyframes enterGlow {
            from {
                opacity: 0.65;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
                margin-top: 50px;
            }

            #enter-text {
                font-size: 21px;
                letter-spacing: 3px;
            }

            .button {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Falling stars -->
    <div id="stars"></div>

    <!-- Enter screen -->
    <div id="enter-screen">
        <div id="enter-text">
            CLICK TO ENTER
        </div>
    </div>

    <!-- Random Music -->
    <audio id="music" preload="auto"></audio>

    <!-- Title -->
    <h1>GUY777 MOD HUB</h1>

    <!-- Buttons -->
    <div class="buttons">

        <a href="https://www.mediafire.com/file/swfd0uh2fvariu7/DeltaV67.apk/file"
           class="button">
            Delta
        </a>

        <a href="https://www.mediafire.com/file/pdomsm1was8gsx3/TheOcularMigraine.apk/file"
           class="button">

        </a>

        <a href="https://www.mediafire.com/file/lm1sx36yt7j3xav/xere1.apk/file"
           class="button">
            67 ADB
        </a>

        <a href="https://www.mediafire.com/file/fm1kd2pnfw2co6q/Moonlit.apk/file"
           class="button">
            Old moonlit
        </a>

        <a href="https://www.mediafire.com/file/z7oa9kohpjej2hb/MoonlitV2.apk/file"
           class="button">
            Moonlit New
        </a>

        <a href="https://www.meta.com/experiences/app/8715195505254856/?hwsh=Z12QNUkVlu&utm_source=twilight&utm_medium=SHARE&utm_parent=SHARING&utm_cohort=ORGANIC_UNKNOWN"
           class="button">
            Lighting Launcher
        </a>

        <a href="https://github.com/Lumince/singularity"
           class="button">
            Singularity root
        </a>

        <a href="https://www.mediafire.com/folder/g5fp1mb6zbojm/Root"
           class="button">
            Root mods
        </a>

    </div>

    <script>
        /* Create falling stars */
        const stars = document.getElementById("stars");

        for (let i = 0; i < 80; i++) {
            const star = document.createElement("div");

            star.classList.add("star");

            star.style.left =
                Math.random() * 100 + "vw";

            star.style.animationDuration =
                (3 + Math.random() * 5) + "s";

            star.style.animationDelay =
                Math.random() * 5 + "s";

            const size =
                1 + Math.random() * 3;

            star.style.width = size + "px";
            star.style.height = size + "px";

            stars.appendChild(star);
        }

        /* Random music */
        const music =
            document.getElementById("music");

        const songs = [
            "Tuff.mp3",
            "JANE.mp3"
        ];

        const randomSong =
            songs[Math.floor(Math.random() * songs.length)];

        music.src = randomSong;
        music.loop = true;

        /* Enter screen */
        const enterScreen =
            document.getElementById("enter-screen");

        enterScreen.addEventListener(
            "click",
            async () => {

                try {
                    await music.play();

                    enterScreen.classList.add("hidden");

                    setTimeout(() => {
                        enterScreen.remove();
                    }, 700);

                } catch (error) {
                    console.error(
                        "Could not start:",
                        error
                    );
                }
            }
        );
    </script>

</body>
</html>
