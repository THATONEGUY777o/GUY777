<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUY777 MOD HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #2b0645 0%, #0b0012 35%, #000000 75%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle, #2b0645 0%, #08000d 50%, #000000 100%);
            cursor: pointer;
            transition: opacity 0.7s ease;
        }

        #enter-text {
            font-family: "Courier New", monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
            color: white;

            text-shadow:
                0 0 5px #ffffff,
                0 0 15px #a020f0,
                0 0 30px #8a2be2,
                0 0 60px #8a2be2;

            animation: enterGlow 1.5s infinite alternate;
        }

        #enter-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            margin-top: 70px;
            margin-bottom: 10px;
            font-family: "Courier New", monospace;
            font-size: 48px;
            letter-spacing: 4px;

            text-shadow:
                0 0 5px #ffffff,
                0 0 15px #a020f0,
                0 0 30px #8a2be2,
                0 0 60px #8a2be2;

            animation: glow 2s infinite alternate;
        }

        .subtitle {
            color: #b9a5c9;
            margin-bottom: 45px;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: min(90%, 450px);
        }

        .button {
            background: rgba(20, 0, 30, 0.8);
            border: 2px solid #9b30ff;
            border-radius: 14px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 17px 25px;
            text-decoration: none;

            box-shadow:
                0 0 8px rgba(155, 48, 255, 0.4);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(90, 10, 130, 0.5);

            box-shadow:
                0 0 10px #9b30ff,
                0 0 25px #9b30ff,
                0 0 45px rgba(155, 48, 255, 0.7);
        }

        .button:active {
            transform: scale(0.97);
        }

        footer {
            margin-top: auto;
            padding: 30px;
            color: #6f6178;
            font-size: 13px;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #8a2be2,
                    0 0 30px #8a2be2;
            }

            to {
                text-shadow:
                    0 0 10px #ffffff,
                    0 0 25px #a020f0,
                    0 0 50px #a020f0,
                    0 0 80px #8a2be2;
            }
        }

        @keyframes enterGlow {
            from {
                opacity: 0.65;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
                margin-top: 50px;
            }

            #enter-text {
                font-size: 21px;
                letter-spacing: 3px;
            }

            .subtitle {
                margin-bottom: 30px;
            }

            .button {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="enter-screen">

    <audio id="tuffMusic" loop preload="auto">

</body>
</html>
